name: CI

# Lint → typecheck → test on every PR and push to main (docs/TechSpecifications.md §8).
# Migrations run against a throwaway Postgres before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only secrets. Real secrets live in the platform secret store,
      # never in the repo (codeguard-1-hardcoded-credentials).
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-that-is-long-enough-32
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-long-enough-32
      ALLOW_INSECURE_COOKIES: "true"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Apply migrations (throwaway DB)
        run: npm run db:deploy
