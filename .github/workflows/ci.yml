name: CI

# Gate for `main`. Runs the same three checks a release depends on, in the
# order that fails cheapest-first: types, then tests, then a real production
# build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push to the same ref makes the in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches .node-version and the `engines` range in package.json.
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        # schema.prisma uses engineType = "client"; the generated client is
        # gitignored, so typecheck and tests cannot resolve @prisma/client
        # without this step.
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # scripts/next-production.mjs pins NODE_ENV=production, so this
        # exercises the same env guards in src/lib/env.ts that a deploy does —
        # which is exactly what caught the ALLOW_INSECURE_COOKIES misconfig.
        run: npm run build
        env:
          # Build-time only. No real secret is needed to compile: the routes are
          # collected, not executed against a live DB. Values must merely be
          # *valid* — env.ts rejects short secrets and insecure cookies in prod.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          JWT_ACCESS_SECRET: ci-placeholder-access-secret-min-32-bytes-long
          JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-min-32-bytes-long
          ALLOW_INSECURE_COOKIES: "false"

# NOTE: `npm run lint` is deliberately absent. `next lint` is interactive on
# first run and deprecated in Next 15; it would hang this runner. Typecheck plus
# the production build are the standing gate until a non-interactive linter
# (T-43 follow-up) replaces it.
